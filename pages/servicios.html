<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios | Taller Mecánico</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header class="encabezado">
    <div class="marca">
        <div class="logo">TM</div>
        <div>
            <h1>TALLER MECÁNICO</h1>
            <p>Gestión de servicios</p>
        </div>
    </div>
</header>

<main class="panel-principal">
    <h2>Registro de servicios</h2>
    <p>Administra los trabajos que realiza el taller.</p>

    <section class="formulario-panel">
        <form id="formServicios">

            <label for="nombreServicio">Nombre del servicio</label>
            <input type="text" id="nombreServicio" required>

            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion">

            <label for="precioServicio">Precio (Bs)</label>
            <input type="number" id="precioServicio" min="0" step="0.01" required>

            <label for="duracion">Duración estimada</label>
            <input type="text" id="duracion" placeholder="Ej. 2 horas">

            <button type="submit">REGISTRAR SERVICIO</button>
            <p id="mensajeServicio"></p>

        </form>
    </section>

    <h2>Servicios disponibles</h2>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Servicio</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Duración</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaServicios"></tbody>
        </table>
    </div>

    <a href="inicio.html" class="salir">Volver al inicio</a>
</main>

<footer>
    <p>© 2026 Taller Mecánico</p>
</footer>

<script src="../js/servicios.js"></script>
</body>
</html>
