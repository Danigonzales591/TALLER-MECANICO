<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuestos | Taller Mecánico</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header class="encabezado">
    <div class="marca">
        <div class="logo">TM</div>
        <div>
            <h1>TALLER MECÁNICO</h1>
            <p>Inventario de repuestos</p>
        </div>
    </div>
</header>

<main class="panel-principal">
    <h2>Registro de repuestos</h2>
    <p>Controla las piezas y materiales del taller.</p>

    <section class="formulario-panel">
        <form id="formRepuestos">

            <label for="nombreRepuesto">Nombre del repuesto</label>
            <input type="text" id="nombreRepuesto" required>

            <label for="codigo">Código</label>
            <input type="text" id="codigo" required>

            <label for="cantidad">Cantidad disponible</label>
            <input type="number" id="cantidad" min="0" required>

            <label for="precioRepuesto">Precio unitario (Bs)</label>
            <input type="number" id="precioRepuesto" min="0" step="0.01" required>

            <button type="submit">REGISTRAR REPUESTO</button>
            <p id="mensajeRepuesto"></p>

        </form>
    </section>

    <h2>Inventario de repuestos</h2>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Repuesto</th>
                    <th>Código</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaRepuestos"></tbody>
        </table>
    </div>

    <a href="inicio.html" class="salir">Volver al inicio</a>
</main>

<footer>
    <p>© 2026 Taller Mecánico</p>
</footer>

<script src="../js/repuestos.js"></script>
</body>
</html>
