<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes de trabajo | Taller Mecánico</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header class="encabezado">
    <div class="marca">
        <div class="logo">TM</div>
        <div>
            <h1>TALLER MECÁNICO</h1>
            <p>Órdenes de trabajo</p>
        </div>
    </div>
</header>

<main class="panel-principal">
    <h2>Registrar orden de trabajo</h2>
    <p>Registra las reparaciones y servicios solicitados por los clientes.</p>

    <section class="formulario-panel">
        <form id="formOrdenes">

            <label for="clienteOrden">Nombre del cliente</label>
            <input type="text" id="clienteOrden" required>

            <label for="placaOrden">Placa del vehículo</label>
            <input type="text" id="placaOrden" required>

            <label for="trabajo">Trabajo solicitado</label>
            <input type="text" id="trabajo" required>

            <label for="mecanico">Mecánico responsable</label>
            <input type="text" id="mecanico" required>

            <label for="costo">Costo total (Bs)</label>
            <input type="number" id="costo" min="0" step="0.01" required>

            <label for="estado">Estado del trabajo</label>
            <select id="estado" required>
                <option value="Pendiente">Pendiente</option>
                <option value="En proceso">En proceso</option>
                <option value="Finalizado">Finalizado</option>
            </select>

            <button type="submit">REGISTRAR ORDEN</button>
            <p id="mensajeOrden"></p>

        </form>
    </section>

    <h2>Lista de órdenes</h2>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Placa</th>
                    <th>Trabajo</th>
                    <th>Mecánico</th>
                    <th>Costo</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="listaOrdenes"></tbody>
        </table>
    </div>

    <a href="inicio.html" class="salir">Volver al inicio</a>
</main>

<footer>
    <p>© 2026 Taller Mecánico</p>
</footer>

<script src="../js/ordenes.js"></script>
</body>
</html>
