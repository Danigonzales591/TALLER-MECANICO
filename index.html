<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico | Sistema de Gestión</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="encabezado">
        <div class="marca">
            <div class="logo">TM</div>
            <div>
                <h1>TALLER MECÁNICO</h1>
                <p>Sistema de gestión automotriz</p>
            </div>
        </div>
    </header>

    <main class="login-contenedor">
        <section class="login-imagen">
            <div class="imagen-texto">
                <h2>Servicio y calidad para tu vehículo</h2>
                <p>Gestiona clientes, vehículos, servicios y reparaciones.</p>
            </div>
        </section>

        <section class="login-panel">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus datos para continuar</p>

            <form id="formLogin">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

                <button type="submit">INGRESAR</button>
                <p id="mensaje"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Taller Mecánico - Sistema de Gestión</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
